<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niklas Shows · Log ind</title>
<link rel="manifest" href="show-manifest.json">
<link rel="apple-touch-icon" href="show-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shows">
<meta name="theme-color" content="#14141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f4f2;--card:#fff;--ink:#14141a;--muted:#6b6b76;--line:#e4e4e0;--accent:#1f4fd8;--accent-ink:#fff;--danger:#c92a2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 50px -30px rgba(20,20,26,.25)}
  .mark{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .mark .sq{width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.5px}
  .mark h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
  .mark p{font-size:13px;color:var(--muted)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:#fafaf9;margin-bottom:16px;outline:none}
  input:focus{border-color:var(--accent);background:#fff}
  button{width:100%;border:0;border-radius:10px;padding:13px;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#000}
  .err{display:none;color:var(--danger);font-size:13px;margin:-6px 0 14px}
  .err.on{display:block}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="mark"><div class="sq">N</div><div><h1>Niklas Shows</h1><p>Booking- og turkalender</p></div></div>
  <label for="u">Brugernavn</label>
  <input id="u" name="username" autocapitalize="none" autocorrect="off" autofocus required>
  <label for="p">Kodeord</label>
  <input id="p" name="password" type="password" required>
  <div class="err" id="err">Forkert brugernavn eller kodeord.</div>
  <button type="submit">Log ind</button>
</form>
<script>
const API=location.hostname.endsWith('lokly.dk')?'https://show.snorkild.cc':'';
const LOGIN=API?'/login.html':'/show', HOME=API?'/':'/show';
if(API){const _f=window.fetch.bind(window);window.fetch=(u,o={})=>{if(typeof u==='string'&&u.startsWith('/api/')){u=API+u;o=Object.assign({credentials:'include'},o);let t='';try{t=localStorage.getItem('show_token')||''}catch(e){}if(t){o.headers=Object.assign({},o.headers||{},{'X-Session':t});}}return _f(u,o);};}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=new URLSearchParams({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value});
  let r; try{ r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b}); }catch(err){ const e=document.getElementById('err'); e.textContent='Kunne ikke nå serveren. Prøv igen om lidt.'; e.classList.add('on'); return; }
  if(r.ok){ try{const j=await r.json();if(j.token)localStorage.setItem('show_token',j.token);}catch(e){} location.href=HOME; } else { document.getElementById('err').classList.add('on'); }
});
</script>
</body>
</html>
